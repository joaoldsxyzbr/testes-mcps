name: CI bancada

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      sleep_seconds:
        description: "Segundos de espera (para testar cancelamento)"
        default: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Espera opcional
        run: sleep "${{ inputs.sleep_seconds || 0 }}"
      - name: Roda testes
        run: |
          python3 -m unittest discover -s . -p "test_*.py" -v
